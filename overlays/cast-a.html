<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><style>
html,body{margin:0;height:100%;width:100%;overflow:hidden;background:transparent;
 font-family:"Chakra Petch","Trebuchet MS",system-ui,sans-serif;pointer-events:none;}
#dock{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;
 align-items:flex-end;gap:10px;opacity:0;transform:translateY(24px);
 transition:opacity .5s ease, transform .5s cubic-bezier(.2,.8,.2,1);}
#dock.in{opacity:1;transform:translateY(0);}
#sprite{pointer-events:auto;cursor:default;height:150px;width:auto;
 filter:drop-shadow(0 6px 14px #000000cc);animation:bob 4s ease-in-out infinite;display:block;}
@keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
#bubble{max-width:250px;background:#0c0c11;color:#f4f4f7;border:2px solid var(--edge,#ff2d78);
 border-radius:14px;padding:10px 13px;font-size:13px;line-height:1.4;
 box-shadow:0 0 16px #ff2d7855,0 6px 20px #000000cc;position:relative;
 opacity:0;transform:translateY(6px);pointer-events:none;transition:opacity .22s ease,transform .22s ease;}
#bubble.show{opacity:1;transform:translateY(0);}
#bubble b{color:#ffe600;}
@media (prefers-reduced-motion:reduce){#sprite{animation:none;}#dock{transition:opacity .3s;}}
</style></head><body>

var dock=document.getElementById("dock"),sprite=document.getElementById("sprite"),bubble=document.getElementById("bubble");
var current=null,last=-1;
function pick(){if(CAST.length===1)return 0;var n;do{n=Math.floor(Math.random()*CAST.length);}while(n===last);last=n;return n;}
function speak(){if(!current)return;bubble.innerHTML=current.quips[Math.floor(Math.random()*current.quips.length)];bubble.classList.add("show");}
function hush(){bubble.classList.remove("show");}
sprite.addEventListener("mouseenter",speak);sprite.addEventListener("mouseleave",hush);
sprite.addEventListener("focus",speak);sprite.addEventListener("blur",hush);
function appear(){current=CAST[pick()];sprite.src=current.img;
 document.documentElement.style.setProperty("--edge",current.edge);
 bubble.style.borderColor=current.edge;bubble.style.boxShadow="0 0 16px "+current.edge+"55,0 6px 20px #000000cc";
 dock.classList.add("in");
 setTimeout(function(){hush();dock.classList.remove("in");},7000);
 setTimeout(appear,120000+Math.random()*120000);}
setTimeout(appear,14000);

<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><style>
html,body{margin:0;height:100%;width:100%;overflow:hidden;background:transparent;
 font-family:"Chakra Petch","Trebuchet MS",system-ui,sans-serif;pointer-events:none;}
#dock{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;
 align-items:flex-end;gap:10px;pointer-events:none;
 opacity:0;transform:translateY(26px);
 transition:opacity .5s ease, transform .5s cubic-bezier(.2,.8,.2,1);}
#dock.in{opacity:1;transform:translateY(0);}
#sprite{pointer-events:none;cursor:default;height:132px;width:auto;display:block;
 filter:drop-shadow(0 6px 14px #000000cc);animation:bob 4s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
#bubble{max-width:250px;background:#0c0c11;color:#f4f4f7;border:2px solid var(--edge,#ff2d78);
 border-radius:14px;padding:10px 13px;font-size:13px;line-height:1.4;pointer-events:none;
 box-shadow:0 0 16px #ff2d7855,0 6px 20px #000000cc;
 opacity:0;transform:translateY(6px);transition:opacity .3s ease,transform .3s ease;}
#bubble.show{opacity:1;transform:translateY(0);}
#bubble b{color:#ffe600;}
@media (prefers-reduced-motion:reduce){#sprite{animation:none;}#dock{transition:opacity .3s;}}
</style></head><body>

var VISIBLE_MS=14000;   /* character stays on screen ~14s */
var GAP_MS=40000;       /* quiet gap before the next one */
var dock=document.getElementById("dock"),sprite=document.getElementById("sprite"),bubble=document.getElementById("bubble");
var idx=-1,current=null;
function showNext(){
  idx=(idx+1)%CAST.length;
  current=CAST[idx];
  sprite.src=current.img;
  document.documentElement.style.setProperty("--edge",current.edge);
  bubble.style.borderColor=current.edge;
  bubble.style.boxShadow="0 0 16px "+current.edge+"55,0 6px 20px #000000cc";
  bubble.innerHTML=current.quips[Math.floor(Math.random()*current.quips.length)];
  dock.classList.add("in");
  setTimeout(function(){bubble.classList.add("show");}, 550);   /* bubble after slide-in */
  setTimeout(hide, VISIBLE_MS);
}
function hide(){
  bubble.classList.remove("show");
  dock.classList.remove("in");
  setTimeout(showNext, GAP_MS);
}
setTimeout(showNext, 5000);
